<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Emoji-Rätsel</title>
  <link rel="stylesheet" href="../static/common.css">
  <link rel="stylesheet" href="../static/party.css">
  <script src="../static/common.js"></script>
  <script src="../static/art.js"></script>
  <script src="../static/party.js"></script>
  <script>
    // Lobby illustration (kept here as a fallback until it is part of art.js).
    window.ART = window.ART || {};
    window.ART.emojiraten = window.ART.emojiraten || `<svg class="art" viewBox="0 0 220 120" role="img" aria-hidden="true"><defs><linearGradient id="era" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="erb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><filter id="ersh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#140a3c" flood-opacity=".28"/></filter></defs><g filter="url(#ersh)"><rect x="14" y="14" width="136" height="56" rx="24" fill="#fff"/><path d="M40 69 L32 86 L56 69 Z" fill="#fff"/></g><text x="82" y="53" text-anchor="middle" font-size="32" font-family="system-ui">🦁👑</text><g filter="url(#ersh)" transform="rotate(8 180 46)"><rect x="160" y="22" width="44" height="48" rx="12" fill="url(#erb)"/></g><text x="182" y="58" text-anchor="middle" font-size="32" font-weight="900" fill="#fff" font-family="Inter,system-ui,sans-serif" transform="rotate(8 180 46)">?</text><g filter="url(#ersh)"><rect x="72" y="84" width="134" height="28" rx="14" fill="url(#era)"/></g><text x="139" y="103" text-anchor="middle" font-size="13" font-weight="850" fill="#fff" font-family="Inter,system-ui,sans-serif">König der Löwen ✓</text></svg>`;
  </script>
  <style>
    .cat { font-size: .78rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .emo { font-size: clamp(3rem, 15vw, 5.2rem); line-height: 1.15; letter-spacing: .06em; padding: 18px 22px; border-radius: 26px;
      background: linear-gradient(160deg, var(--glass-strong), var(--glass)); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
      display: flex; flex-wrap: wrap; justify-content: center; gap: .08em; max-width: 100%; }
    .emo span { display: inline-block; animation: emopop .55s cubic-bezier(.2,.9,.3,1.5) both; }
    @keyframes emopop { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
    .reveal .emo { font-size: clamp(2.2rem, 10vw, 3.4rem); padding: 10px 18px; }
    .tvmain .emo { font-size: clamp(5rem, 10vw, 11rem); padding: 2vw 3vw; border-radius: 3vw; }
    .tvmain .reveal .emo { font-size: clamp(3rem, 6vw, 6.5rem); }
    .eq { font-size: 1.6rem; font-weight: 900; color: var(--muted); margin: -6px 0; }
    .tries { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .tries s { padding: 4px 10px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--glass-border); color: var(--muted); font-size: .85rem; }
    .lives { font-size: .85rem; color: var(--muted); font-weight: 650; }
    .shake { animation: shake .45s ease; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .good { font-size: 1.25rem; font-weight: 850; color: var(--ok); animation: popin .5s cubic-bezier(.2,.9,.3,1.3) both; }
    .good small { display: block; font-size: .85rem; color: var(--muted); font-weight: 650; margin-top: 4px; }
    .out { font-weight: 750; color: var(--muted); }
    .solvedbar { font-weight: 750; color: var(--muted); }
    .solvedbar b { color: var(--ok); }
    .res { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .res .r { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-border); text-align: left; animation: rise .4s ease both; }
    .res .r.ok { box-shadow: inset 4px 0 0 var(--ok); }
    .res .r.first { box-shadow: 0 0 0 2px var(--ok); }
    .res .n { font-weight: 700; min-width: 0; flex: none; max-width: 32%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res .t { flex: 1; min-width: 0; color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res .r:not(.ok) .t { text-decoration: line-through; opacity: .8; }
    .res .sec { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .res .pts { font-weight: 850; color: var(--ok); min-width: 32px; text-align: right; }
    .tvmain .res .r { font-size: clamp(1rem, 1.5vw, 1.7rem); }
    .tvmain .res .t { font-size: inherit; }
    .ghostbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .85rem; padding: 4px; }
  </style>
</head>
<body>
  <section id="table" class="hidden">
    <div class="topbar glass">
      <span class="title">Emoji-Rätsel</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div id="stage"></div>
  </section>
  <script>
    const esc = s => Shell.esc(s);
    // Split into user-perceived characters, so every emoji can pop in on its own.
    const chars = s => window.Intl && Intl.Segmenter ? [...new Intl.Segmenter("de", { granularity: "grapheme" }).segment(s)].map(x => x.segment) : [s];
    const emo = s => `<div class="emo" aria-label="${esc(s)}">${chars(s).map((c, i) => `<span style="animation-delay:${i * 120}ms">${esc(c)}</span>`).join("")}</div>`;
    let lastTries = 0;

    function mine(g, ctx) {
      if (ctx.tv) return "";
      if (g.my_solved) return `<div class="good">✓ Richtig!<small>Die Punkte gibt's bei der Auflösung – je schneller, desto mehr.</small></div>`;
      if (g.my_out) return `<p class="out">${g.my_tries.length ? "Keine Versuche mehr" : "Du hast gepasst"} – mal sehen, was es war …</p>
        ${g.my_tries.length ? `<div class="tries">${g.my_tries.map(t => `<s>${esc(t)}</s>`).join("")}</div>` : ""}`;
      const left = g.max_tries - g.my_tries.length;
      return `${Party.form("guessForm", "Was ist das?", "Raten", 80)}
        ${g.my_tries.length ? `<p class="lives">Leider nicht – noch ${left} ${left === 1 ? "Versuch" : "Versuche"}</p><div class="tries">${g.my_tries.map(t => `<s>${esc(t)}</s>`).join("")}</div>` : `<p class="lives">${g.max_tries} Versuche · Groß-/Kleinschreibung und kleine Tippfehler sind egal</p>`}
        <button class="ghostbtn" id="pass">Ich passe</button>`;
    }

    Party.start({
      kind: "emojiraten", title: "Emoji-Rätsel", art: "emojiraten", minPlayers: 2, icon: "🧩",
      inputPhases: ["guess"],
      settings: [
        { key: "rounds", label: "Runden", options: [[10, "10 Rätsel"], [5, "5 Rätsel"], [15, "15 Rätsel"], [20, "20 Rätsel"]] },
        { key: "seconds", label: "Zeit", options: [[45, "45 Sekunden"], [30, "30 Sekunden"], [60, "60 Sekunden"], [0, "Ohne Zeitlimit"]] },
        { key: "category", label: "Kategorie", options: [[0, "Alles gemischt"], [1, "🎬 Filme & Serien"], [2, "📖 Märchen & Bücher"],
          [3, "💬 Sprichwörter & Redewendungen"], [4, "🧩 Zusammengesetzte Wörter"], [5, "👷 Berufe"], [6, "🌍 Städte & Länder"], [7, "🎵 Musik & Lieder"]] },
      ],
      build(g, ctx) {
        lastTries = g.my_tries.length;
        if (g.phase === "guess") return `<span class="cat">${esc(g.group || "")}</span>${emo(g.emojis)}
          <div id="mine" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px"></div>
          <p class="solvedbar" id="solvedbar"></p><div data-status></div>${ctx.tv ? "<p>Ratet auf euren Handys!</p>" : ""}`;
        const res = g.results || [];
        return `<div class="reveal" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
          <span class="cat">${esc(g.group || "")}</span>${emo(g.emojis)}<div class="eq">=</div><div class="pbig">${esc(g.answer)}</div>
          <div class="res">${res.map((r, i) => { const p = g.players.find(q => q.id === r.id) || { name: "?" };
            return `<div class="r ${r.solved ? "ok" : ""} ${r.place === 1 ? "first" : ""}" style="animation-delay:${i * 60}ms">${Shell.avatar(p)}
              <span class="n">${esc(p.name)}</span><span class="t">${r.solved ? "✓ " + esc(r.text) : r.text ? esc(r.text) : "–"}</span>
              ${r.solved ? `<span class="sec">${Party.num(r.time)} s</span>` : ""}<span class="pts">${r.points ? "+" + r.points : ""}</span></div>`; }).join("")}</div>
          ${res.some(r => r.solved) ? "" : "<p>Diesmal hat es niemand erraten.</p>"}
          ${ctx.tv ? "" : `<h3 class="plabel" style="align-self:flex-start">Punktestand</h3>${Party.ranking(g, { gained: true })}`}</div>`;
      },
      celebrate: (g, ctx) => (g.results || []).some(r => r.place === 1 && r.id === Shell.me),
      update(g, ctx) {
        if (g.phase !== "guess") return;
        const total = g.players.filter(p => !p.screen).length;
        const bar = document.getElementById("solvedbar");
        if (bar) bar.innerHTML = g.solved ? `<b>${g.solved}</b> von ${total} ${g.solved === 1 ? "hat" : "haben"} es schon!` : "";
        const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#guessForm");
        if (Party.set("mine", mine(g, ctx))) {
          Party.onForm("guessForm", v => Shell.send({ t: "guess", value: v }));
          const input = document.querySelector("#guessForm input");
          if (typing && input) input.focus();   // keep the keyboard open after a wrong guess
          const pass = document.getElementById("pass");
          if (pass) pass.onclick = () => { if (confirm("Dieses Rätsel auslassen?")) Shell.send({ t: "pass" }); };
          if (g.my_tries.length > lastTries) {
            const f = document.getElementById("guessForm") || document.getElementById("mine");
            f.classList.add("shake");
            if (navigator.vibrate) navigator.vibrate(120);
          }
          if (g.my_solved && navigator.vibrate) navigator.vibrate([40, 40, 80]);
        }
        lastTries = g.my_tries.length;
      },
    });
  </script>
</body>
</html>
